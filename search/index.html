    <h1 class="pagehead__title">搜索</h1>

  <form class="searchbox" role="search" data-search-form>
    <label class="visually-hidden" for="q">关键词</label>
    <input id="q" name="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="关键词，空格分隔，全部命中才算匹配…" data-search-input>
    <button type="submit">搜索</button>
  </form>

  <div class="searchfilters">
    <label>领域
      <select data-filter="domain">
        <option value="">全部</option>
        <option value="literature">文学</option>
        <option value="philosophy">哲学</option>
        <option value="compsci">计算机科学</option>
      </select>
    </label>
    <label>类型
      <select data-filter="kind">
        <option value="">全部</option>
        <option value="诗">诗</option>
        <option value="小说">小说</option>
        <option value="散文">散文</option>
        <option value="随笔">随笔</option>
        <option value="翻译">翻译</option>
        <option value="书信">书信</option>
        <option value="日记">日记</option>
        <option value="片段">片段</option>
        <option value="论文">论文</option>
        <option value="札记">札记</option>
        <option value="对话">对话</option>
        <option value="评论">评论</option>
        <option value="术语">术语</option>
        <option value="思想实验">思想实验</option>
        <option value="技术文章">技术文章</option>
        <option value="算法笔记">算法笔记</option>
        <option value="系统设计">系统设计</option>
        <option value="论文笔记">论文笔记</option>
        <option value="实验">实验</option>
        <option value="工具">工具</option>
        <option value="踩坑">踩坑</option>
      </select>
    </label>
    <label>标签
      <select data-filter="tag"><option value="">全部</option></select>
    </label>
    <label>年份
      <select data-filter="year"><option value="">全部</option></select>
    </label>
  </div>

  <p class="searchstatus" role="status" aria-live="polite" data-search-status>
    <span class="searchstatus__text">载入索引后就能检索。</span>
  </p>
  <ol class="entries searchresults" data-search-results></ol>
