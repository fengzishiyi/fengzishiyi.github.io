<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA · NHB 1430.2 的网页转译</title>
<meta name="description" content="把《NASA Graphics Standards Manual》（NHB 1430.2，1976）的版面规则翻成网页：两种专色、一个字体家族、一张 12 栏网格，以及从参考片里取出的八个图版构件。">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://fengzishiyi.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 120'%3E%3Cg fill='none' stroke='%23FC3D21' stroke-width='18'%3E%3Cpath d='M9 100V40a22 22 0 0 1 44 0v20a22 22 0 0 0 44 0V0'/%3E%3Crect x='133' y='9' width='90' height='82' rx='41'/%3E%3Cpath d='M259 0L298 91L337 0' stroke-linejoin='round'/%3E%3Cpath d='M373 100L412 9L451 100' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<meta property="og:site_name" content="NOVA">
<meta property="og:type" content="website">
<meta property="og:title" content="NOVA · NHB 1430.2 的网页转译">
<meta property="og:description" content="两种专色、一个字体家族、一张 12 栏网格，以及从参考片里取出的八个图版构件。">
<meta property="og:url" content="https://fengzishiyi.github.io/">
<meta property="og:locale" content="zh_CN">
<style>
/* ─────────────────────────────────────────────
   依据 NHB 1430.2（1976）
   1.1 字标   1.3/1.5 色彩   1.4 深色/浅色背景
   5.3 字体   5.5 层级靠字号与留白   5.14 网格与页码
   ───────────────────────────────────────────── */
:root{
  color-scheme: light;
  --red:#FC3D21;         /* NASA Red：只做状态与非文字记号，只在白色或浅底上（1.3 / 1.4） */
  --gray:#A39C93;        /* NASA Warm Gray：大面积色块（1.5） */
  --gray-ink:#6B655E;    /* 加深版，用于小字：对白底 5.76:1（实测） */
  --black:#000;
  --white:#fff;
  --paper:#F7F6F4;
  --hair:#d8d4ce;

  --sans:"Helvetica Neue", Helvetica, "Nimbus Sans", Arial,
         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei Light",
         "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* 字阶 8 : 4 : 2.3 : 1 —— 四档，没有第五档 */
  --t-display:clamp(56px, 10.5vw, 132px);
  --t-title:clamp(28px, 4vw, 52px);
  --t-sub:22px;
  --t-body:17px;
  --t-micro:12px;
  --t-tiny:10px;

  --cols:12; --gutter:24px; --margin:clamp(20px,5vw,72px); --max:1320px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{
  margin:0;background:var(--white);color:var(--black);
  font-family:var(--sans);font-weight:300;font-size:var(--t-body);line-height:1.7;
  -webkit-font-smoothing:antialiased;font-kerning:normal;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
main{flex:1 0 auto}
#app:focus,#app:focus-visible{outline:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
a:hover{text-decoration-thickness:2px}
::selection{background:var(--black);color:var(--white)}
:focus-visible{outline:2px solid var(--black);outline-offset:3px}
h1,h2,h3,h4{font-weight:500;margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--margin)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:var(--gutter)}
.hair{border:0;border-top:1px solid #000;margin:0}
.redline{border:0;border-top:1px solid var(--red);margin:0}
.muted{color:var(--gray-ink)}
.skip{position:absolute;left:8px;top:-100px;z-index:60;background:#000;color:#fff;padding:8px 14px;font-size:14px;text-decoration:none}
.skip:focus{top:8px}

/* ── 微注：9–12px 全大写，字距 +.08em，全站同一个样式（参考片里每一张图版都有） ── */
.micro{font-size:var(--t-micro);line-height:1.45;letter-spacing:.02em;color:var(--gray-ink)}
.tiny{font-size:var(--t-tiny);line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
.dot::before{content:"";display:inline-block;width:5px;height:5px;background:var(--red);margin-right:.5em;vertical-align:.12em}

/* ── 页眉：字标 + 识别文字（1.2）+ 页签（参考片 00:01:52） ── */
.mast{padding:26px 0 0}
.mast .top{align-items:end;padding-bottom:18px}
.brand{grid-column:1 / span 3;color:var(--red);text-decoration:none;display:flex;align-items:flex-end}
.brand svg{width:128px;height:auto;display:block}
.ident{grid-column:4 / span 4;font-size:11px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink)}
.ident b{color:#000;font-weight:500;display:block;letter-spacing:.02em;font-size:12px}
.mast .stamp{grid-column:9 / span 4;justify-self:end;text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid #000;border-bottom:1px solid #000}
.tabs a{
  flex:0 0 auto;padding:9px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;border-right:1px solid var(--hair);color:var(--gray-ink);
  border-bottom:2px solid transparent;
}
.tabs a:first-child{padding-left:0}
.tabs a b{font-weight:500;color:#000;margin-right:.55em;letter-spacing:.04em}
.tabs a:hover{color:#000}
.tabs a[aria-current="page"]{color:#000;background:var(--paper);border-bottom-color:var(--red)}
.tabs a[aria-current="page"] b{color:#000}

/* ── 运行头：滚过标题后停在顶部，回答「我在哪一节」（5.14 的页码规则搬到屏幕上） ── */
.runhead{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid #000}
.runhead .wrap{display:flex;align-items:baseline;gap:16px;padding-top:7px;padding-bottom:7px}
.runhead .n{font-size:11px;font-weight:500;letter-spacing:.08em}
.runhead .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
.runhead .f{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:.06em}

/* ── 进度：红色填充 + 节刻度。刻度就是「还剩几节」，不是装饰（6 节时共 6 格） ── */
.progress{position:fixed;left:0;top:0;height:2px;width:100%;background:transparent;z-index:40;pointer-events:none}
.progress i{position:absolute;left:0;top:0;height:2px;width:0;background:var(--red)}
.progress b{position:absolute;top:0;width:1px;height:5px;background:rgba(0,0,0,.32);transform:translateX(-.5px)}

/* ── hero：出血显示字 + 一句定位 ── */
/* 注意：这里只能用 padding-top/bottom，用 padding 简写会把 .wrap 的左右边距清零，
   首页 hero 就会比页眉、卡片左移一个边距宽度 */
.hero{padding-top:clamp(40px,7vw,88px);padding-bottom:clamp(24px,4vw,48px)}
.hero .eyebrow{grid-column:1 / span 5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.hero h1{grid-column:1 / span 10;font-size:var(--t-title);font-weight:300;line-height:1.12;letter-spacing:-.02em;margin-top:14px}
.hero .lede{grid-column:4 / span 6;font-size:16px;line-height:1.7;margin-top:28px}
/* 出血显示字：从版心左缘起排，被下边缘切掉一截（参考片 00:02:23 的做法） */
.bleed{margin-top:clamp(20px,4vw,40px);overflow:hidden;height:clamp(72px,16.5vw,216px)}
.bleed span{
  display:block;font-weight:500;letter-spacing:-.05em;line-height:.98;
  font-size:clamp(96px,26vw,340px);white-space:nowrap;
}

/* ── 图版：状态卡牌（参考片 00:00:31 / 00:02:23） ── */
.cards{row-gap:0;padding:0 0 8px}
.card{
  grid-column:span 4;border-top:1px solid #000;padding:14px 0 0;text-decoration:none;
  display:block;position:relative;
}
.card + *{border-left:0}
.card .no{font-size:var(--t-title);font-weight:500;line-height:1;letter-spacing:-.03em}
.card .nm{font-size:15px;font-weight:500;margin-top:12px}
.card .en{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-ink);margin-top:4px}
.card p{font-size:13px;line-height:1.6;color:var(--gray-ink);margin-top:12px;min-height:3.2em}
.card .band{border-top:1px solid var(--hair);margin-top:12px;padding-top:8px}
.card:hover .no{text-decoration:underline;text-decoration-thickness:1px}
.card[aria-current="page"]{background:var(--paper)}

/* ── 微注带：一张图版的底边，永远有这一行 ── */
.metaband{
  display:flex;flex-wrap:wrap;gap:0 1.6em;padding-top:10px;border-top:1px solid #000;
  font-size:var(--t-tiny);letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink);
}
.metaband b{font-weight:500;color:#000;letter-spacing:.06em}

/* ── 黑色标签块：参考片里放图标与分类的那一块 ── */
.labelblock{display:inline-flex;align-items:stretch;background:#000;color:#fff;font-size:12px;letter-spacing:.04em}
.labelblock .ic{display:flex;align-items:center;justify-content:center;width:34px;border-right:1px solid #4a4a4a;font-size:11px;font-weight:500}
.labelblock .tx{padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.labelblock .tx small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a9a9a9}

/* ── 读数带：标签 + 数值，一行一个事实（参考 UI 片 00:00:22） ── */
.readout{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid #000;border-bottom:1px solid #000}
.readout div{padding:12px 12px 14px 0;border-right:1px solid var(--hair)}
.readout div:last-child{border-right:0}
.readout dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.readout dd{margin:6px 0 0;font-size:26px;font-weight:500;line-height:1;letter-spacing:-.01em}
.readout dd small{font-size:11px;font-weight:400;letter-spacing:.04em;margin-left:.3em}

/* ── 章节页 ── */
.head{padding:clamp(36px,6vw,72px) 0 0}
.head .no{grid-column:1 / span 2;font-size:var(--t-title);font-weight:500;line-height:1;letter-spacing:-.03em}
.head .ttl{grid-column:3 / span 10}
.head h1{font-size:var(--t-title);font-weight:500;line-height:1.1;letter-spacing:-.02em}
.head .en{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-ink);margin-top:8px}
.head .lede{grid-column:3 / span 7;font-size:16px;line-height:1.72;margin-top:22px}
.head .cite{grid-column:10 / span 3;font-size:10px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink);margin-top:22px}
.body{padding:clamp(28px,4vw,48px) 0 64px}
.side{grid-column:1 / span 2;font-size:11px;line-height:1.6}
.side .sticky{position:sticky;top:52px}
.side ol{list-style:none;margin:0;padding:0;border-top:1px solid #000}
.side li a{display:block;padding:7px 0;text-decoration:none;color:var(--gray-ink);border-bottom:1px solid var(--hair)}
.side li a b{font-weight:500;color:#000;display:inline-block;min-width:2.4em;font-size:10px;letter-spacing:.06em}
.side li a[aria-current="true"]{color:#000;border-bottom-color:var(--red);box-shadow:inset 0 -1px 0 var(--red)}
.side li a[aria-current="true"] b{color:var(--red)}
.prose{grid-column:3 / span 7;font-size:16px;line-height:1.78;max-width:34em}
.prose > * + *{margin-top:1.1em}          /* 3.3：用行距代替首行缩进 */
.prose h2{font-size:21px;line-height:1.3;margin-top:2.2em;scroll-margin-top:56px}
.prose h3{font-size:15px;font-weight:500;margin-top:1.8em;letter-spacing:0}
.prose p{text-wrap:pretty}
.prose ul{padding-left:1.15em}
.prose li + li{margin-top:.4em}
.prose code{font-family:inherit;font-weight:500;background:var(--paper);padding:.08em .32em}
.prose blockquote{margin:1.8em 0;padding:0 0 0 20px;border-left:1px solid #000}
.prose blockquote p{font-size:15px;line-height:1.7}
.prose blockquote cite{display:block;margin-top:8px;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
.prose table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.5}
.prose th,.prose td{text-align:left;vertical-align:top;padding:8px 12px 8px 0;border-bottom:1px solid var(--hair)}
.prose th{font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink);border-bottom-color:#000}
.gutter{grid-column:10 / span 3;font-size:11px;line-height:1.55;color:var(--gray-ink)}
.gutter .sticky{position:sticky;top:52px}
.gutter b{display:block;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#000;margin-bottom:6px}
.gutter .gblock + .gblock{margin-top:22px}

/* ── 标本 ── */
.spec{border:1px solid #000;padding:0;margin-top:1.6em}
.spec .hd{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;background:#000;color:#fff;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.spec .hd em{font-style:normal;color:#c9c9c9}
.spec .bd{padding:18px 12px 16px}
.spec .bd > * + *{margin-top:14px}
.spec .note{font-size:10px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink);padding:0 12px 10px}
.scale i{display:block;font-style:normal;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.scale .d{font-size:52px;font-weight:300}
.scale .t{font-size:30px;font-weight:500}
.scale .s{font-size:22px;font-weight:300}
.scale .b{font-size:17px;font-weight:300}
.scale .m{font-size:12px;letter-spacing:.02em;color:var(--gray-ink)}
.scale .x{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);border:0}
.sw > div{display:flex;flex-direction:column}
.sw .chip{height:88px;margin-bottom:8px}
.sw .nm{font-size:11px;font-weight:500}
.sw .vl{font-size:10px;letter-spacing:.06em;color:var(--gray-ink);margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;height:96px}
.bars i{background:rgba(0,0,0,.06);border-left:1px solid rgba(0,0,0,.28);border-right:1px solid rgba(0,0,0,.28)}
.ruler{display:flex;align-items:flex-end;gap:0;height:22px;border-bottom:1px solid #000}
.ruler span{flex:1;border-left:1px solid #000;height:6px;position:relative;font-size:9px;letter-spacing:.06em;color:var(--gray-ink);padding-left:3px;line-height:22px}
.ruler span:last-child{border-right:0}
.donot{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.donot figure{margin:0}
.donot .box{height:84px;display:flex;align-items:center;justify-content:center;border:1px solid var(--hair);background:#fff;padding:12px;overflow:hidden}
.donot .box svg{width:64%}
.donot figcaption{font-size:10px;line-height:1.45;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink);margin-top:6px}
.donot figcaption b{color:#000}
.tabdemo{display:flex;border-bottom:1px solid #000}
.tabdemo span{padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink);border-bottom:2px solid transparent}
.tabdemo span.on{color:#000;border-bottom-color:var(--red);background:var(--paper)}
.readdemo{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #000;border-bottom:1px solid #000}
.readdemo div{padding:10px 10px 12px 0;border-right:1px solid var(--hair)}
.readdemo div:last-child{border-right:0}
.readdemo dt{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.readdemo dd{margin:5px 0 0;font-size:20px;font-weight:500;line-height:1}
.ghostdemo{position:relative;height:96px;overflow:hidden;border:1px solid var(--hair)}
.ghostdemo span{position:absolute;right:-.06em;bottom:-.24em;font-size:150px;font-weight:500;letter-spacing:-.05em;color:rgba(0,0,0,.07);line-height:1}
.ghostdemo em{position:absolute;left:10px;top:10px;font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.bleeddemo{overflow:hidden;line-height:.8;border:1px solid var(--hair);padding:0}
.bleeddemo span{display:block;font-size:74px;font-weight:500;letter-spacing:-.05em;white-space:nowrap;transform:translateX(-.06em)}
.edgedemo{border:1px solid var(--hair);padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;min-height:96px}
.edgedemo em{font-style:normal;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.edgedemo strong{font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1}

/* ── 页脚：黑底白字标（1.4：深色背景上一律白色） ── */
.foot{background:#000;color:#fff;margin-top:auto}
.foot .grid{padding:44px 0 36px;align-items:end}
.foot .fbrand{grid-column:1 / span 3;color:#fff}
.foot .fbrand svg{width:104px;display:block}
.foot .fident{grid-column:4 / span 4;font-size:11px;line-height:1.6;letter-spacing:.04em;color:#cfcac3}
.foot .fident b{color:#fff;font-weight:500;display:block;letter-spacing:.06em;text-transform:uppercase;font-size:10px;margin-bottom:6px}
.foot .fmeta{grid-column:8 / span 4;font-size:10px;line-height:1.7;letter-spacing:.06em;text-transform:uppercase;color:#cfcac3}
.foot a{color:#fff}
.foot :focus-visible{outline-color:#fff}
.foot .folio{grid-column:12 / span 1;text-align:right;font-size:13px;font-weight:500;letter-spacing:.04em}

/* ── 网格叠加层（5.14）：带栏号，是工具不是装饰 ── */
.overlay{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}
.overlay.on{display:block}
.overlay .wrap,.overlay .grid{height:100%}
.overlay i{background:rgba(252,61,33,.07);border-left:1px solid rgba(252,61,33,.4);border-right:1px solid rgba(252,61,33,.4);
  position:relative;font-size:9px;letter-spacing:.04em;color:rgba(252,61,33,.75);padding-top:2px;padding-left:2px}
.gbtn{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:none;border:1px solid #fff;padding:4px 9px;margin-top:10px;cursor:pointer}
.gbtn[aria-pressed="true"]{background:#fff;color:#000}

/* ── 平板 ── */
@media (max-width:1020px){
  .brand{grid-column:1 / span 3}
  .ident{grid-column:4 / span 5}
  .mast .stamp{grid-column:1 / -1;justify-self:start;text-align:left;margin-top:12px}
  .card{grid-column:span 6}
  .prose,.head .lede{grid-column:3 / span 8}
  .head h1{font-size:clamp(26px,4.6vw,44px)}
  .gutter{grid-column:3 / span 8;margin-top:8px}
  .readout{grid-template-columns:repeat(3,1fr)}
  .readout div:nth-child(3n){border-right:0}
  .prose table{font-size:12px}
}
/* ── 手机：网格收 4 栏 ── */
@media (max-width:720px){
  :root{--cols:4;--gutter:16px;--t-body:16px}
  .grid > *{grid-column:1 / -1!important}
  .tabs a{padding:8px 10px;font-size:11px}
  .tabs a b{margin-right:.4em}
  .hero{padding-top:32px}
  .hero h1{font-size:clamp(26px,7.4vw,38px)}
  .card{grid-column:1 / -1!important;border-top:1px solid #000}
  .card p{min-height:0}
  .card{grid-column:span 4}
  .side{display:none}
  .prose{font-size:15px}
  .head .no{font-size:44px}
  .head h1{font-size:clamp(24px,7vw,34px)}
  .head .lede,.head .cite{margin-top:14px}
  .sw{grid-template-columns:repeat(2,1fr);gap:16px}
  .donot{grid-template-columns:repeat(2,1fr)}
  .readout{grid-template-columns:repeat(2,1fr)}
  .readout div:nth-child(2n){border-right:0}
  .scale .d{font-size:40px}
  .scale .t{font-size:26px}
  .foot .fident,.foot .fmeta{margin-top:18px}

  html:`
<h2 id="t1">1.1　三条不可让的规则</h2>

  html:`
<h2 id="g1">5.14　三步</h2>

<h2 id="g2">本站的网格</h2>
<p>12 栏，栏距 24px，最大宽度 1320px，外边距随视口在 20–72px 之间变化；手机收成 4 栏。标题挂在第 1–2 栏，正文从第 3 栏起，页边注在第 10–12 栏——这就是手册里“标题在左栏、正文在右”的页面结构。</p>

<p>这五件有一个共同点：<b>它们的状态由内容决定，不由时间决定。</b>所以它们不需要缓动、不需要时长、也不会在你不看的时候自己动。</p>

<h2 id="m2">删掉的六件，以及为什么</h2>

<h2 id="m3">从参考片里学到的分寸</h2>
<p>按 1 秒 1 帧看完两条片之后，做了一次统计：UI 片 1:31 里，真正承担信息的动作只有两类——<b>“已到达/已选中”的状态变化</b>（红条、红线、当前项）和<b>“还剩多少”的累加</b>（进度、点数）；其余大量动效（线条生长、面板滑入、整屏色涌）都在做气氛。<b>气氛不能搬进一个读文字的页面。</b>PV 片 5:19 也一样：它的版面几乎全是静止的图版，动效只做两件事——缓慢推近，和一条表示“选中”的红线。</p>
<p>所以本站的动效预算只有上面那五件，全部是状态，没有一件是时间。</p>

/* ── 元信息 ── */
function setMeta(name, value, prop){
  const sel = prop ? `meta[property="${name}"]` : `meta[name="${name}"]`;
  let el = document.querySelector(sel);
  if (!el) { el = document.createElement('meta'); el.setAttribute(prop ? 'property' : 'name', name); document.head.appendChild(el); }
  el.setAttribute('content', value);
}
function writeHead(title, desc, rest){
  document.title = title;
  setMeta('description', desc);
  setMeta('og:title', title, true);
  setMeta('og:description', desc, true);
  setMeta('og:url', SITE.origin + '/' + rest, true);
}

/* ── 功能动效：全部是状态，不是时间 ── */
const marks = [];           /* 每节的页码锚点 {el, folio} */
let io = null;

let lastFolio = '';
function setFolio(v){
  if (v === lastFolio) return;
  lastFolio = v;
  const f = $('#folio'); if (f) f.textContent = v;
  const r = $('#runfolio'); if (r) r.textContent = v;
}
function observe(root, section){
  marks.length = 0;
  root.querySelectorAll('.prose h2[id]').forEach((h, i) => {
    /* 只有带手册编号的小节改变页码；没有编号的正文小节沿用上一节 */
    marks.push({ el: h, folio: headingNum(h.textContent) || null });
  });
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(list => {
    list.forEach(e => {
      if (!e.isIntersecting) return;
      const m = marks.find(x => x.el === e.target);
      if (!m) return;
      if (m.folio) setFolio(m.folio);
      document.querySelectorAll('.side a').forEach(a => {
        if (a.getAttribute('href').endsWith('/' + e.target.id)) a.setAttribute('aria-current','true');
        else a.removeAttribute('aria-current');
      });
    });
  }, { rootMargin:'0px 0px -70% 0px', threshold:0 });
  marks.forEach(m => io.observe(m.el));
  const firstNum = marks.find(m => m.folio);
  if (firstNum) setFolio(firstNum.folio);
}

/* 进度条：填充宽度 + 每节一根刻度（刻度用可用的节数均分） */
function paintTicks(count){
  document.querySelectorAll('.progress b').forEach(b => b.remove());
  const box = $('#progress');
  for (let i = 1; i < count; i++){
    const b = document.createElement('b');
    b.style.left = (i / count * 100) + '%';
    box.appendChild(b);
  }
}
let scrollable = 0;
function measure(){ scrollable = document.documentElement.scrollHeight - innerHeight; }
function progress(){
  const h = location.hash || '';
  if (!h.startsWith('#/') || h === '#/' || h === '#') { fill.style.width = '0'; measure(); return; }
  if (scrollable <= 0) measure();
  fill.style.width = (scrollable > 0 ? Math.min(100, scrollY / scrollable * 100) : 0) + '%';
}
addEventListener('scroll', progress, { passive:true });
addEventListener('resize', () => { measure(); progress(); }, { passive:true });

/* ── 路由 ── */
const ALIAS = { standards:'plate', about:'refs', archive:'' };
let lastKey = '';
function route(){
  const hash = location.hash || '#/';
  if (!hash.startsWith('#/')) { if (hash === '#app') app.focus({ preventScroll:true }); return; }
  const [, page='', anchor] = hash.split('/');
  const id = ALIAS[page] !== undefined ? ALIAS[page] : page;

  let html, title, desc, rest = id, active = id || 'home';
  if (!id) {
    html = viewHome();
    title = `${SITE.name} · NHB 1430.2 的网页转译`;
    desc = SITE.desc;
    paintTicks(7);
  } else {
    const i = SECTIONS.findIndex(s => s.id === id);
    if (i < 0) {
      html = viewMissing();
      title = `没有这个页面 · ${SITE.name}`;
      desc = '地址可能变了。';
      active = 'none';
      paintTicks(1);
    } else {
      const s = SECTIONS[i];
      html = viewSection(s, i);
      title = `${s.no} ${s.title} · 手册 ${s.folio} · ${SITE.name}`;
      desc = s.lede;
      paintTicks(1);
    }
  }

  const key = id + '|' + anchor;
  if (key !== lastKey) {
    const first = lastKey === '';
    app.innerHTML = html;
    paintSpecimens(app);
    lastKey = key;
    window.scrollTo(0, 0);
    if (!first) app.focus({ preventScroll:true });
    const sec = SECTIONS.find(s => s.id === id);
    if (sec) observe(app, sec); else { marks.length = 0; setFolio('—'); }
    document.querySelectorAll('.side a, .head, .body').forEach(el => el.removeAttribute('aria-current'));
    measure();
  }
  if (anchor) document.getElementById(anchor)?.scrollIntoView({ behavior: rm.matches ? 'auto' : 'smooth' });

  writeHead(title, desc, rest);
  setMeta('og:type', 'website', true);
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === active) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  progress();
}
addEventListener('hashchange', route);

/* ── 网格叠加层（5.14）：带栏号 ── */
const ov = $('#overlay'), gbtn = $('#gbtn'), ovcols = $('#ovcols');
ovcols.innerHTML = Array.from({length:12},(_,i)=>`<i>${String(i+1).padStart(2,'0')}</i>`).join('');
function toggleGrid(){
  const on = ov.classList.toggle('on');
  gbtn.setAttribute('aria-pressed', String(on));
  gbtn.textContent = on ? '隐藏网格（G）' : '显示网格（G）';
}
gbtn.addEventListener('click', toggleGrid);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key.toLowerCase() === 'g') toggleGrid();
});

/* 点在当前页的链接上：回到顶部 */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  const t = (a.getAttribute('href') || '').replace(/^#\//,'') || 'home';
  const c = (location.hash || '').replace(/^#\//,'') || 'home';
  if (t === c && a.getAttribute('href').split('/').length <= 2) window.scrollTo(0, 0);
});

route();
</script>
