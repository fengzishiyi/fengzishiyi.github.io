<html lang="zh-CN">

<meta property="og:url" content="https://fengzishiyi.github.io/">

<style>
/* ─────────────────────────────────────────────
   依据 NHB 1430.2（1976）
   1.1 字标   1.3/1.5 色彩   1.4 深色/浅色背景
   5.3 字体   5.5 层级靠字号与留白   5.14 网格与页码
   版面构件取自参考片，出处写在 /standards 里
   ───────────────────────────────────────────── */
:root{
  color-scheme: light;
  --red:#FC3D21;         /* NASA Red：只做状态与非文字记号，只在白或浅底上（1.3 / 1.4） */
  --gray:#A39C93;        /* Warm Gray：大面积色块（1.5） */
  --gray-ink:#6B655E;    /* 加深版，小字用：对纸面 5.33:1（实测） */
  --black:#000;
  --white:#fff;
  --paper:#F7F6F4;
  --hair:#d8d4ce;
  /* 第二专色的两个值阶：同一支暖灰，只变浓度（1.5） */
  --g-12:rgba(163,156,147,.12);   /* 读数带底：合成 #EDEBE8，黑字 17.65:1 */
  --g-30:rgba(163,156,147,.30);   /* 章节号牌底：合成 #DEDBD7，黑字 15.22:1 */

  --sans:"Helvetica Neue", Helvetica, "Nimbus Sans", Arial,
         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei Light",
         "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  /* 字阶 8 : 4 : 2.3 : 1 —— 四档，没有第五档 */
  --t-display:clamp(48px, 9.5vw, 132px);
  --t-title:clamp(28px, 4vw, 52px);
  --t-sub:22px;
  --t-body:17px;
  --t-micro:12px;
  --t-tiny:10px;

  --cols:12; --gutter:24px; --margin:clamp(20px,5vw,72px); --max:1320px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{
  margin:0;background:var(--white);color:var(--black);
  font-family:var(--sans);font-weight:300;font-size:var(--t-body);line-height:1.7;
  -webkit-font-smoothing:antialiased;font-kerning:normal;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
main{flex:1 0 auto}
#app:focus,#app:focus-visible{outline:none}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em}
a:hover{text-decoration-thickness:2px}
::selection{background:var(--black);color:var(--white)}
:focus-visible{outline:2px solid var(--black);outline-offset:3px}
h1,h2,h3,h4{font-weight:500;margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--margin)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:var(--gutter)}
.hair{border:0;border-top:1px solid #000;margin:0}
.muted{color:var(--gray-ink)}
.skip{position:absolute;left:8px;top:-100px;z-index:60;background:#000;color:#fff;padding:8px 14px;font-size:14px;text-decoration:none}
.skip:focus{top:8px}

/* ── 微注：9–12px，字距 +.02em（参考片每张图版的底边都有这一行） ── */
.micro{font-size:var(--t-micro);line-height:1.45;letter-spacing:.02em;color:var(--gray-ink)}
.tiny{font-size:var(--t-tiny);line-height:1.4;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
.dot::before{content:"";display:inline-block;width:5px;height:5px;background:var(--red);margin-right:.5em;vertical-align:.12em}

/* ── 页眉：字标 + 识别文字（1.2）+ 页签（参考片 00:01:52） ── */
.mast{padding:26px 0 0}
.mast .top{align-items:end;padding-bottom:18px}
.brand{grid-column:1 / span 3;color:var(--red);text-decoration:none;display:flex;align-items:flex-end}
.brand svg{width:128px;height:auto;display:block}
.ident{grid-column:4 / span 4;font-size:11px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink)}
.ident b{color:#000;font-weight:500;display:block;letter-spacing:.02em;font-size:12px}
.mast .stamp{grid-column:9 / span 4;justify-self:end;text-align:right;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.tabs{display:flex;flex-wrap:wrap;border-top:1px solid #000;border-bottom:1px solid #000}
.tabs a{
  position:relative;flex:0 0 auto;padding:9px 14px 11px;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;text-decoration:none;border-right:1px solid var(--hair);color:var(--gray-ink);
}
.tabs a:first-child{padding-left:0}
.tabs a b{font-weight:500;color:#000;margin-right:.55em;letter-spacing:.04em}
.tabs a:hover{color:#000}
/* 红线＝当前：出现时播放，移除时瞬时（只进不退） */
.tabs a::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);
  transform:scaleX(0);transform-origin:left;
}
.tabs a[aria-current="page"]{color:#000;background:var(--paper)}
.tabs a[aria-current="page"]::after{transform:scaleX(1);animation:markIn .22s linear}
@keyframes markIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tabs a[aria-current="page"] b{color:#000}

/* ── 运行头：滚过标题后停在顶部（5.14 的页码规则搬到屏幕上） ── */
.runhead{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid #000}
.runhead .wrap{display:flex;align-items:baseline;gap:16px;padding-top:7px;padding-bottom:7px}
.runhead .n{font-size:11px;font-weight:500;letter-spacing:.08em}
.runhead .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
.runhead .f{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ── 进度：红色填充 + 节刻度 ── */
.progress{position:fixed;left:0;top:0;height:2px;width:100%;background:transparent;z-index:40;pointer-events:none}
.progress i{position:absolute;left:0;top:0;height:2px;width:0;background:var(--red)}
.progress b{position:absolute;top:0;width:1px;height:5px;background:rgba(0,0,0,.32);transform:translateX(-.5px)}

/* 就地组装：只进不退，出场硬切；无位移、无缩放、无淡出 */
.as-line,.as-set{--d:0ms}
@media (prefers-reduced-motion: no-preference){
  .as-line{transform:scaleX(0);transform-origin:left;transition:transform .34s linear var(--d)}
  .as-set{clip-path:inset(0 100% 0 0);transition:clip-path .44s cubic-bezier(.2,.7,.1,1) calc(var(--base,0ms) + var(--d))}
  .mount .as-line{transform:scaleX(1)}
  .mount .as-set{clip-path:inset(0 0 0 0)}

  .as-plq{clip-path:inset(0 100% 0 0);transition:clip-path .16s linear .56s}
  .mount .as-plq{clip-path:inset(0 0 0 0)}

  .plate .fra{transform-origin:left;animation:scanX .7s linear both}
  .plate .frt{transform-origin:top;animation:scanY .62s linear .08s both}

  .ticks i{animation:tickOn .08s linear both;animation-delay:calc(var(--base,0ms) + var(--d,0ms))}

  .leader .ln{transform:scaleX(0);transition:transform .22s linear var(--d,0ms)}
  .mount .leader .ln{transform:scaleX(1)}
  .leader .end{visibility:hidden;animation:hardShow .01s linear .22s forwards}
  .mount .leader .end{animation-delay:calc(var(--d,0ms) + .22s)}

  .curtain{clip-path:inset(0 0 100% 0);transition:clip-path .32s linear var(--d,0ms)}
  .mount .curtain{clip-path:inset(0 0 0 0)}

  .ribbon{clip-path:inset(0 100% 0 0);transition:clip-path .24s linear .08s}
  .mount .ribbon{clip-path:inset(0 0 0 0)}

  .corns i{clip-path:inset(0 100% 100% 0);animation:cornerIn .22s linear both;animation-delay:calc(var(--base,0ms) + 40ms)}

  .card::after{transition:transform .22s linear}
}
@keyframes scanX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes scanY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tickOn{from{background:var(--hair)}to{background:#000}}
@keyframes hardShow{to{visibility:visible}}
@keyframes cornerIn{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion: reduce){
  .tabs a[aria-current="page"]::after{animation:none}
  .card::after,.side li a[aria-current="true"]{transition:none}
  .plate .fra,.plate .frt,.ticks i,.leader .end,.corns i{animation:none}
  .leader .end{visibility:visible}
  .corns i,.curtain,.as-plq,.ribbon{clip-path:none}
}

/* ── hero：出血显示字 + 一句定位 ── */
.hero{padding-top:clamp(32px,6vw,76px);padding-bottom:clamp(18px,3vw,34px)}
.hero .eyebrow{grid-column:1 / span 5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.hero h1{grid-column:1 / span 10;font-size:var(--t-display);font-weight:300;line-height:1.02;letter-spacing:-.03em;margin-top:14px}
.hero .lede{grid-column:4 / span 6;font-size:16px;line-height:1.7;margin-top:24px}
.hero .lede cite{display:block;margin-top:8px;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink)}
/* 出血显示字：只切下边缘，保留字顶（PV 00:02:23 的裁法） */
.bleed{--bf:clamp(66px,16vw,192px);margin-top:clamp(6px,1.4vw,16px);overflow:hidden;height:calc(var(--bf) * .58)}
.bleed span{display:block;font-weight:500;letter-spacing:-.05em;line-height:1;font-size:var(--bf);white-space:nowrap;transform:translateX(-.04em)}

/* ── 头条：黑底图版（1.4：深底上一律白字） ── */
.lead{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:var(--gutter);padding-bottom:clamp(28px,5vw,56px)}
.lead .plate{
  grid-column:1 / span 7;position:relative;display:block;text-decoration:none;
  background:#000;color:#fff;aspect-ratio:4/3;overflow:hidden;
  border:1px solid #000;
}
/* 白细线：黑底上只能用白（1.4），所以内部分栏线是白的，不是红的 */
.lead .plate .fra{position:absolute;left:0;right:0;top:26px;height:1px;background:rgba(255,255,255,.45)}
.lead .plate .frt{position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18);left:74%}
.lead .plate .tag{position:absolute;left:20px;top:9px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.lead .plate .mark{position:absolute;right:20px;top:9px;width:64px;color:#fff}
.lead .plate .big{
  position:absolute;left:-.04em;bottom:-.18em;font-weight:500;line-height:1;
  font-size:clamp(120px,17vw,268px);letter-spacing:-.05em;
}
.lead .ltxt{grid-column:9 / span 4;display:flex;flex-direction:column;justify-content:flex-end}
.lead .ltxt .metaband{margin-top:0}
.lead .ltxt h2{font-size:clamp(24px,2.8vw,40px);font-weight:500;line-height:1.16;margin:16px 0 0;text-wrap:balance}
.lead .ltxt p{font-size:14px;line-height:1.65;color:var(--gray-ink);margin-top:12px}
.lead .ltxt .more{margin-top:18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.lead .ltxt .more a{text-decoration:none;border-bottom:1px solid #000}

/* ── 微注带：一张图版的底边，永远有这一行 ── */
.metaband{
  display:flex;flex-wrap:wrap;gap:0 1.6em;padding-top:8px;border-top:1px solid #000;
  font-size:var(--t-tiny);letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink);
}
.metaband b{font-weight:500;color:#000;letter-spacing:.06em}

/* 红牌：每页最多一块（1.3 + 5.12） */
.plq{
  width:96px;height:96px;flex:0 0 auto;background:var(--red);color:#000;
  display:flex;flex-direction:column;justify-content:space-between;padding:9px 10px 8px;
  text-decoration:none;
}
.plq .k{font-size:9px;line-height:1;letter-spacing:.14em;text-transform:uppercase}
.plq .v{font-size:34px;font-weight:500;line-height:.86;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* 牛皮牌：暖灰 30%，靠 1px 边定界 */
.plq--g{background:var(--g-30);box-shadow:inset 0 0 0 1px var(--hair)}
.head .plq{grid-column:1 / span 2;justify-self:start}
.lead .ltxt .plq{align-self:flex-end;margin-bottom:18px}

/* 红带：20px 实色带 + 黑微注 */
.ribbon{
  display:inline-flex;align-items:center;gap:.7em;height:20px;padding:0 8px;
  background:var(--red);color:#000;font-size:9px;line-height:1;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;
}

/* 编号芯片 */
.chip{display:inline-block;border:1px solid #000;padding:2px 6px;font-size:9px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;background:#fff;font-weight:400}

/* 刻度尺：12 格，每 4 格长刻 */
.ticks{display:flex;justify-content:space-between;align-items:flex-end;height:12px;border-bottom:1px solid #000;margin-top:14px}
.ticks i{width:1px;height:4px;background:var(--hair)}
.ticks i:nth-child(4n+1){height:8px}

/* 引线标注：端子是短横杠，不是箭头 */
.leader{display:flex;align-items:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.leader .dot{width:7px;height:7px;background:var(--red);flex:0 0 auto}
.leader .ln{flex:1;height:1px;background:#000;min-width:24px}
.leader .end{width:1px;height:9px;background:#000;flex:0 0 auto}
.leader .chip{margin-left:0}

/* 角标纸牌：四角 8px L 线 */
.corns{position:relative}
.corns > i{position:absolute;width:8px;height:8px;pointer-events:none}
.corns > i:nth-child(1){top:0;left:0;border-top:1px solid #000;border-left:1px solid #000}
.corns > i:nth-child(2){top:0;right:0;border-top:1px solid #000;border-right:1px solid #000}
.corns > i:nth-child(3){bottom:0;left:0;border-bottom:1px solid #000;border-left:1px solid #000}
.corns > i:nth-child(4){bottom:0;right:0;border-bottom:1px solid #000;border-right:1px solid #000}

/* 标本里收窄，免得读成又一条分栏线 */
.spec .bd .ticks,.spec .bd .leader,.spec .bd .corns{max-width:320px}
.wrap.rel{position:relative}
.vnote{position:absolute;left:0;top:0;writing-mode:vertical-rl;font-size:9px;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-ink)}

/* ── 图版：状态卡牌（参考片 00:00:31 / 00:02:23） ── */
.cards{row-gap:0;padding:0 0 8px}
.card{
  grid-column:span 4;border-top:1px solid #000;padding:16px 0 0;text-decoration:none;
  display:flex;flex-direction:column;position:relative;
}
/* 悬停＝“指向当前”那一根红线：盖在黑色顶线上，从左长出，不是位移 */
.card::after{
  content:"";position:absolute;left:0;top:-1px;width:100%;height:2px;background:var(--red);
  transform:scaleX(0);transform-origin:left;
}
.card:hover::after,.card:focus-visible::after{transform:scaleX(1)}
.card .crow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card .no{font-size:var(--t-title);font-weight:500;line-height:.92;letter-spacing:-.03em}
.card .est{font-size:var(--t-tiny);letter-spacing:.12em;text-transform:uppercase;color:var(--gray-ink);text-align:right}
.card .crule{height:1px;background:#000;margin:14px 0 12px}
.card .nm{font-size:var(--t-sub);font-weight:500;line-height:1.2}
.card p{font-size:13px;line-height:1.6;color:var(--gray-ink);margin-top:8px;min-height:3.2em}
.card .band{margin-top:auto;padding-top:10px;border-top:1px solid var(--hair)}
.card:hover .nm{text-decoration:underline;text-decoration-thickness:1px}

/* ── 读数带：标签 + 数值，一行一个事实（UI 00:00:22） ── */
.readout{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid #000;border-bottom:1px solid #000;background:var(--g-12)}
.readout div{padding:12px 12px 14px 0;border-right:1px solid var(--hair)}
.readout div:first-child{padding-left:14px}
.readout div:last-child{border-right:0;padding-right:14px}
.readout dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink)}
.readout dd{margin:6px 0 0;font-size:26px;font-weight:500;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.readout dd small{font-size:11px;font-weight:400;letter-spacing:.04em;margin-left:.3em}

/* ── 章节页 / 文章页眉 ── */
.head{padding:clamp(28px,5vw,60px) 0 0;position:relative;overflow:hidden}
.head .ghostno{position:absolute;right:-.01em;top:-.06em;font-size:clamp(110px,17vw,230px);font-weight:500;line-height:.9;letter-spacing:-.05em;color:rgba(0,0,0,.045);pointer-events:none;user-select:none}
.head .no{grid-column:1 / span 2;font-size:var(--t-title);font-weight:500;line-height:1;letter-spacing:-.03em}
.head .ttl{grid-column:3 / span 8}
.head h1{font-size:var(--t-title);font-weight:500;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.head .en{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-ink);margin-top:8px}
.head .lede{grid-column:3 / span 7;font-size:16px;line-height:1.72;margin-top:20px}
.head .cite{grid-column:10 / span 3;font-size:10px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-ink);margin-top:20px}
.body{padding:clamp(24px,4vw,44px) 0 56px}
.side{grid-column:1 / span 2;font-size:11px;line-height:1.6}
.side .sticky{position:sticky;top:52px}
.side ol{list-style:none;margin:0;padding:0;border-top:1px solid #000}
.side li a{display:block;padding:7px 0;text-decoration:none;color:var(--gray-ink);border-bottom:1px solid var(--hair)}
.side li a b{font-weight:500;color:#000;display:inline-block;min-width:2.4em;font-size:10px;letter-spacing:.06em}
.side li a[aria-current="true"]{color:#000;border-bottom-color:var(--red);box-shadow:inset 0 -1px 0 var(--red)}
.side li a[aria-current="true"] b{color:var(--red)}
.prose{grid-column:3 / span 7;font-size:var(--t-body);line-height:1.78;max-width:34em}
.prose > * + *{margin-top:1.1em}          /* 3.3：用行距代替首行缩进 */
.prose h2{font-size:21px;line-height:1.3;margin-top:2.2em;scroll-margin-top:56px}
.prose p{text-wrap:pretty}
.prose ul{padding-left:1.15em}
.prose li + li{margin-top:.4em}
.prose code{font-family:inherit;font-weight:500;background:var(--paper);padding:.08em .32em}
.prose pre{background:var(--paper);padding:16px 18px;overflow:auto;font-size:12px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.prose pre code{background:none;padding:0;font-weight:inherit;font-family:inherit}
.prose blockquote{margin:1.8em 0;padding:0 0 0 20px;border-left:1px solid #000}
.prose blockquote p{font-size:15px;line-height:1.7}
.prose table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.5}
.prose th,.prose td{text-align:left;vertical-align:top;padding:8px 12px 8px 0;border-bottom:1px solid var(--hair)}
.prose th{font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-ink);border-bottom-color:#000}

<body>
<a class="skip" href="#app">跳到正文</a>
<div class="progress" id="progress" aria-hidden="true"><i id="pfill"></i></div>

<header class="mast">
  <div class="wrap">
    <div class="grid top">
      <a class="brand" href="#/" aria-label="NOVA 首页" data-mark></a>
      <div class="ident"><b>NOVA · 设计、工程与太空</b>NHB 1430.2 的网页转译</div>
      <div class="stamp">1976 年 1 月生效<br>本页 2026</div>
    </div>
    <nav class="tabs" aria-label="主导航" id="tabs"></nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<div class="colorbars" aria-hidden="true"></div>

<footer class="foot">
  <div class="wrap">
    <div class="grid">
      <div class="fbrand" data-mark></div>
      <div class="fident"><b>NOVA</b>把 NHB 1430.2（1976）的版面规则翻成网页。个人练习，与 NASA 无关；NASA 的 Worm 字标受法规保护，本站未使用。</div>
      <div class="fmeta">
        单文件 · 零外部请求 · 无依赖<br>
        <a href="https://github.com/fengzishiyi" rel="me noopener">GitHub</a><br>
        <button class="gbtn" id="gbtn" type="button" aria-pressed="false">网格（G）</button><button class="sbtn" id="sbtn" type="button" aria-pressed="false">音效（S）</button>
      </div>
      <div class="folio" id="folio" aria-label="页码">1.0</div>
    </div>
  </div>
</footer>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="wrap"><div class="grid" id="ovcols"></div></div>
</div>

<script>
/* ── 站点事实。改名字只改这里 ── */
const SITE = {
  name:'NOVA',
  origin:'https://fengzishiyi.github.io',
  desc:'一个按《NASA Graphics Standards Manual》（NHB 1430.2，1976）排版的个人博客：两种专色、一个字体家族、一张 12 栏网格。'
};

/* 字标：单线字形，等宽笔画、无横杠、坐水平基线（1.1 的三条原则） */
function mark(){
  return `<svg viewBox="0 0 460 120" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="18">
    <path d="M9 100V40a22 22 0 0 1 44 0v20a22 22 0 0 0 44 0V0"/>
    <rect x="133" y="9" width="90" height="82" rx="41"/>
    <path d="M259 0L298 91L337 0" stroke-linejoin="round"/>
    <path d="M373 100L412 9L451 100" stroke-linejoin="round"/>
  </svg>`;
}
function hydrateMarks(root){
  root.querySelectorAll('[data-mark]:empty').forEach(el=>{ el.insertAdjacentHTML('afterbegin', mark()); });
}
hydrateMarks(document);

/* ── 文章数据。编号沿用手册的「章.节」体例：1.x 为文章 ── */
const POSTS = [
{ slug:'graphics-standards-1976', no:'1.6', cat:'设计', date:'2026-10-12', read:9, cover:'1976',
  title:'重读 1976 年的 NASA 图形标准手册',
  deck:'Danne & Blackburn 为 NASA 制定的这本手册，用两种颜色、一套字体和一张网格，管住了一个机构的全部视觉输出。这个博客就是照着它做的。',
  body:`
<p>手册的编号是 NHB 1430.2，1976 年 1 月生效。它的核心是那个后来被叫作「Worm」的字标：N、A、S、A 四个字母被简化到只剩一种笔画宽度，两个 A 去掉了横杠，整个字标获得一种向上的推力。</p>
<p>手册对这个字标的保护近乎严苛：不能重画，只能用制版原稿翻拍；不能放进圆形、方框；不能描边、加阴影、竖排。这些规定今天读来依然有效，因为它们讲的是同一件事：识别靠的是一致，而一致只能靠约束。</p>
<h2 id="color">两种颜色，以及红色的使用条件</h2>
<p>手册只定义了两种专色：NASA Red 和 NASA Warm Gray。红色被描述为「一种非常活跃的颜色，给字母带来动感」，但它的使用条件写得很清楚：只在有第二色可用时使用，只用在白色或浅色背景上，不与其他鲜艳色或中深色同时出现，否则红色会被稀释。</p>
<blockquote>NASA red should not be used with other bright saturated colors, or medium and dark value colors, as they will dilute the effectiveness and impact of the NASA red.</blockquote>
<p>所以这个博客里，红色只出现在页眉字标、页签下划线、阅读进度条、目录当前项、网格叠加层，以及页脚上面那条色标里的一段。它们全是状态或工具，不是阅读内容。正文、链接、按钮全部是黑白与暖灰。</p>
<h2 id="type">Helvetica Light 与 Medium</h2>
<p>Helvetica 是整个系统里「最重要的字体家族」。Light 和字标一起构成识别的基础，标题用 Medium，并且使用大小写混排而不是全大写。手册在 Garamond 一页里还有一条很实用的话：粗体不够重时，靠加大字号或在标题周围留空来补偿，而不是换更粗的字重。</p>
<p>中文没有 Helvetica，但原则可以翻译：正文用细体，标题用中等字重，用尺寸和空白而不是粗细建立层级。</p>
<h2 id="grid">网格先于内容</h2>
<p>5.14 节把网格的用法写成三步：先分析出版物的尺寸和内容类型，再把网格应用到对开页上，由它决定边距、栏距和页码位置，最后才把标题、正文、图片和图注放进去。还有一个细节：页码永远放在外侧边距。</p>
<p>网页没有对开页，但有视口。把 CSS Grid 当成印刷网格用，每个元素就有了确定的位置，而不是靠一次次调 margin。本站用 12 栏，按 G 键可以看到它。</p>
<h2 id="after">后来</h2>
<p>1992 年 NASA 恢复了圆形的「Meatball」徽标，Worm 退役。2020 年它又回到了猎鹰 9 号的箭体上。好的系统会被重新发现，因为它解决的问题一直都在。</p>`},
{ slug:'css-grid-as-print-grid', no:'1.5', cat:'工程', date:'2026-09-28', read:6,
  title:'把 CSS Grid 当作印刷网格来用',
  deck:'手册 5.14 节的三步法，换成 CSS 只需要几行。难的是先决定栏数，而不是写代码。',
  body:`
<p>印刷设计里，网格是一种「预先决定的结构」，它在内容到来之前就存在。网页开发里我们常常反过来：先放内容，再用间距把它们推到看起来对的地方。</p>
<h2 id="define">先定义，再放置</h2>
<p>本站的整个版面只有一个网格定义：</p>
<pre><code>.grid{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  column-gap:24px;
}</code></pre>
<p>此后所有元素只做一件事：声明自己从第几栏开始、跨几栏。标题栏永远是 1–3，正文永远从第 4 栏开始。这对应手册里「标题挂在左栏、正文在右」的页面结构。</p>
<h2 id="mobile">小屏幕</h2>
<p>手机上网格收为 4 栏，所有块占满整行。规则没有变，只是栏数变了，这比为每个组件写一套断点样式要稳定得多。</p>`},
{ slug:'voyager-49', no:'1.4', cat:'太空', date:'2026-09-05', read:5,
  title:'旅行者 1 号的第 49 年',
  deck:'1977 年 9 月 5 日发射，2012 年进入星际空间。它离我们越来越远，但信号还在。',
  body:`
<p>旅行者 1 号是目前距离地球最远的人造物体。它在 2012 年 8 月穿过日球层顶，成为第一个进入星际空间的探测器。</p>
<p>为了节省逐年衰减的核电池电力，工程师们这些年陆续关闭了它的部分仪器和加热器。每一次关闭都是一次取舍：保留哪些数据，放弃哪些。</p>
<h2 id="restraint">克制也是一种工程</h2>
<p>这让我想到图形手册里对红色的限制。资源有限时，你必须决定把它用在哪里。旅行者的电力和一个品牌的注意力，本质上是同一种问题。</p>`},
{ slug:'helvetica-light-cjk', no:'1.3', cat:'字体', date:'2026-08-17', read:7,
  title:'Helvetica Light 与中文正文',
  deck:'西文用细体做正文很常见，中文却很少。原因不在审美，而在字体回退。',
  body:`
<p>手册把 Helvetica Light 定为识别与正文的基础字重。在网页上复现这一点，西文部分很容易，中文部分取决于用户系统里有什么。</p>
<h2 id="fallback">回退顺序</h2>
<p>本站的字体栈是 Helvetica Neue、Helvetica、Arial，然后是苹方、冬青黑体、微软雅黑 Light 与思源黑体。macOS 和 iOS 上苹方有完整的细体；Windows 上要注意「微软雅黑 Light」是一个独立的家族名，只写「微软雅黑」再设 300 字重是选不到细体的。</p>
<h2 id="size">字号与行距</h2>
<p>细体中文需要更大的字号和行距才能保持可读：正文 17px，行高 1.78。小字用加深过的暖灰 #6B655E，对白底的对比度保持在 4.5:1 以上；手册原色 Warm Gray 只用于大面积色块。</p>`},
{ slug:'zero-dependency-blog', no:'1.2', cat:'工程', date:'2026-07-30', read:4,
  title:'一个零依赖的小博客',
  deck:'一个 HTML 文件，没有构建步骤，没有框架，没有外部字体，也没有一次第三方请求。',
  body:`
<p>这个博客是一个单独的 HTML 文件。文章是一段 JavaScript 数组，路由用 URL 的 hash，样式全部写在一个 style 标签里。</p>
<p>它的缺点很明显：文章多了以后不好维护，也不利于搜索引擎，而且关掉 JavaScript 就什么都看不见。作为一个设计系统的样张，它足够把规则讲清楚。真正要长期写下去，把同一套 CSS 放进任何静态站点生成器即可。</p>`},
{ slug:'less-after-more', no:'1.1', cat:'随笔', date:'2026-07-02', read:3,
  title:'先有很多，才能减少',
  deck:'简化是结果，不是起点。',
  body:`
<p>Worm 字标看起来简单，但那种简单是拿掉东西之后的结果。两个 A 的横杠就是被拿掉的东西，拿掉以后，字标才有了向上的推力。</p>
<p>写作也一样。我现在的习惯是先写得很长，然后删掉一半。</p>`}
];

function viewPost(slug){

    <hr class="hair as-line" style="margin-top:24px">

  <div class="runhead" aria-hidden="true">

  <div class="wrap">

/* ── 规范：本站自己的图版手册 ── */
function viewStandards(){
  return `
  <div class="wrap rel">
    <span class="vnote" aria-hidden="true">Standards · 03</span>
    <div class="grid head">
      <span class="ghostno" aria-hidden="true">03</span>
      <div class="plq plq--g"><span class="k">Section</span><span class="v">03</span></div>
      <div class="ttl as-set" style="--d:90ms"><h1>规范</h1><div class="en">Standards</div></div>
      <p class="lede as-set" style="--d:190ms">这一页是本站自己的图形标准：色彩、字体、网格、图版、动效，逐条对应手册的章节，或者对应参考片里的一个时间码。</p>
      <p class="cite as-set" style="--d:270ms">NHB 1430.2（1976）<br>参考片：PV 5:19 · UI 1:31</p>
    </div>
    <hr class="hair as-line" style="margin-top:24px">
  </div>
  <div class="wrap">
    <div class="grid body">
      <nav class="side" aria-label="规范目录"><div class="sticky"><ol>
        <li><a href="#/standards/colo"><b>01</b>色彩</a></li>
        <li><a href="#/standards/type"><b>02</b>字体</a></li>
        <li><a href="#/standards/grid"><b>03</b>网格</a></li>
        <li><a href="#/standards/mark"><b>04</b>字标</a></li>
        <li><a href="#/standards/plate"><b>05</b>图版</a></li>
        <li><a href="#/standards/motion"><b>06</b>动效</a></li>
      </ol></div></nav>
      <article class="prose">
        <h2 id="colo">01　色彩：三个面 + 一块红牌</h2>
        <p>手册只定义两个专色（NASA Red、Warm Gray），然后用两页写清红色什么时候不许用：<b>有第二色才用、只在白或浅底上用、不和饱和色并用</b>。所以本站没有第三种颜色，只有同一支暖灰的两个值阶，和一块红。</p>
        <p>版面因此是四级值阶：纸白 → 灰 12% → 灰 30% → 黑。红只做两件事：一块 96×96 的红牌（每页最多一块，承载一个编号），以及页签、进度、悬停那几根 2px 线。</p>
        <div class="spec curtain">
          <div class="hd"><span>标本 S1　三个面 + 一块红牌</span><em>1.3 / 1.5 / 5.12</em></div>
          <div class="bd">
            <div class="sw five">
              <div><div class="swatch" style="background:#F7F6F4;border:1px solid #d8d4ce"></div><span class="nm">纸面</span><span class="vl">#F7F6F4</span></div>
              <div><div class="swatch" style="background:#EDEBE8"></div><span class="nm">灰 12</span><span class="vl">#EDEBE8</span></div>
              <div><div class="swatch" style="background:#DEDBD7"></div><span class="nm">灰 30</span><span class="vl">#DEDBD7</span></div>
              <div><div class="swatch" style="background:#000"></div><span class="nm">黑</span><span class="vl">#000000</span></div>
              <div><div class="swatch" style="background:#FC3D21"></div><span class="nm">NASA Red</span><span class="vl">#FC3D21</span></div>
            </div>
            <div class="plqrow">
              <span class="plq"><span class="k">POST</span><span class="v">1.6</span></span>
              <span class="plq plq--g"><span class="k">SECTION</span><span class="v">01</span></span>
              <span class="ribbon">Ribbon · 20px</span>
            </div>
          </div>
          <div class="note">实测：黑 on 红 5.83:1 ｜ 黑 on 灰30 15.22:1 ｜ 小字 #6B655E on 纸 5.33:1 ｜ 暖灰 #A39C93 on 纸 2.51:1，只做面，不做字。</div>
        </div>
        <p>面积预算：纸面 84–90%，黑 6–12%，灰屏 2–6%，红 ≤0.8%。红牌 96×96 在 1440×900 上占 0.71%，已经是全站唯一一块饱和面——所以每页只许一块，红牌与红带不并存。灰屏只差 3.2 / 8.6 个 L*，必须靠 1px 边线定界，不单独承担结构。</p>

        <h2 id="type">02　字体</h2>
        <p>正文 Light、标题 Medium、标题不做全大写（5.3）。层级不够时靠字号和留白，不靠换更粗的字重（5.5）。全站只有两个字重、四档字号。</p>
        <div class="spec">
          <div class="hd"><span>标本 S2　四档字号</span><em>8 : 4 : 2.3 : 1</em></div>
          <div class="bd"><div class="scale">
            <i class="d">显示 132</i><i class="t">标题 52</i><i class="s">副标 22</i>
            <i class="b">正文 17　把想法变得可见。</i><i class="m">微注 12　NHB 1430.2 · 1976</i>
            <i class="x">TINY 10 · LABEL</i>
          </div></div>
          <div class="note">中文要另外写一条：Windows 上「微软雅黑 Light」是独立家族名，靠字重选不到。</div>
        </div>

        <h2 id="grid">03　网格</h2>
        <p>12 栏、栏距 24px、最大 1320px；手机收 4 栏。标题挂在左栏，正文从第 3 栏起，页边注在第 10–12 栏。页码按 5.14 放外侧——网页上它落在页脚最右一格，并随阅读位置变化。</p>
        <div class="spec">
          <div class="hd"><span>标本 S3　12 栏</span><em>24px gutter</em></div>
          <div class="bd"><div class="bars" aria-hidden="true">${'<i></i>'.repeat(12)}</div>
            <div class="ruler" aria-hidden="true">${Array.from({length:12},(_,i)=>`<span>${String(i+1).padStart(2,'0')}</span>`).join('')}</div>
          </div>
          <div class="note">按 G 键可在任何一页上叠出这张网格，并带栏号。</div>
        </div>

        <h2 id="mark">04　字标</h2>
        <p>三条不在纸上写、但必须守的规则：笔画同宽、去掉 A 的横杠、坐水平基线。第四条是关于「不可重画」的网页译本——字标只有一个矢量源，全站三处引用同一个函数。</p>
        <div class="spec">
          <div class="hd"><span>标本 S4　四条禁则</span><em>1.6 / p.10</em></div>
          <div class="bd"><div class="donot">
            <figure><div class="box"><span style="display:block;color:#000;outline:3px solid #000;outline-offset:6px">${mark()}</span></div><figcaption><b>不可</b>　放进方框</figcaption></figure>
            <figure><div class="box"><span style="display:block;color:#000;filter:drop-shadow(4px 4px 0 #A39C93)">${mark()}</span></div><figcaption><b>不可</b>　加投影</figcaption></figure>
            <figure><div class="box"><span style="display:block;color:#000;transform:rotate(-90deg) scale(.55)">${mark()}</span></div><figcaption><b>不可</b>　竖排</figcaption></figure>
            <figure><div class="box"><span style="display:block;color:#FC3D21;opacity:.3">${mark()}</span></div><figcaption><b>不可</b>　浅色网屏</figcaption></figure>
          </div></div>
          <div class="note">NASA 的 Worm 字标不能用；本站的 NOVA 是照 1.1 另画的原创字形。</div>
        </div>

        <h2 id="plate">05　图版</h2>
        <p>版面构件取自两条参考片，不以装饰出现，只作为构件本身。逐件标了出处：</p>
        <table>
          <tr><th>#</th><th>构件</th><th>出处</th><th>用在本站</th></tr>
          <tr><td>1</td><td>状态卡牌：索引号 + 分栏线 + 名称 + 微注</td><td>PV 00:00:31</td><td>首页索引卡</td></tr>
          <tr><td>2</td><td>微注带：底边一行 10px 全大写</td><td>PV 每张图版</td><td>卡片、头条、页脚</td></tr>
          <tr><td>3</td><td>页签：实心＝当前，空心＝可去</td><td>PV 00:01:52</td><td>主导航</td></tr>
          <tr><td>4</td><td>红细线＝当前</td><td>PV 00:02:07</td><td>页签、目录、卡片悬停</td></tr>
          <tr><td>5</td><td>出血显示字：被边缘切掉一截</td><td>PV 00:02:23</td><td>首页 1430.2、章节号</td></tr>
          <tr><td>6</td><td>幽灵大号字：当作水印</td><td>PV 00:01:52</td><td>每个页眉右上</td></tr>
          <tr><td>7</td><td>读数带：标签小、数值大</td><td>UI 00:00:22</td><td>首页读数、页边读数</td></tr>
          <tr><td>8</td><td>边缘注记：出血区的极小字</td><td>UI 00:01:04</td><td>页眉节号、页脚页码</td></tr>
          <tr><td>9</td><td>色标条：四段细条</td><td>PV 名牌底边</td><td>页脚上沿</td></tr>
          <tr><td>10</td><td>角标纸牌：四角各一段 8px L 线</td><td>PV 奶油牌 / UI 面板角</td><td>引文牌、标本</td></tr>
          <tr><td>11</td><td>刻度尺：细线挂等距刻度，每 4 格一根长刻</td><td>PV 技术图版、UI 00:38</td><td>只在规范标本里出现</td></tr>
          <tr><td>12</td><td>竖排边注：版面左缘的竖排 10px 注记</td><td>PV / UI 左缘</td><td>章节页左缘</td></tr>
          <tr><td>13</td><td>编号芯片：1px 边小牌，内文 <code>01 / 1976</code></td><td>UI 每帧右上</td><td>卡片角标、图版角标</td></tr>
          <tr><td>14</td><td>引线标注：折线拉到标签，端子是一道短横杠</td><td>UI 00:02:38</td><td>标本、图版标注</td></tr>
          <tr><td>15</td><td>叠层纸：2–3 层各偏移 8px，1px 边，无阴影</td><td>UI 00:03:31</td><td>侧栏、标本</td></tr>
          <tr><td>16</td><td>红带：20px 实色带，内嵌黑微注</td><td>UI 红缎带 / PV 横带</td><td>归档页眉、标本</td></tr>
        </table>

        <h2 id="motion">06　动效：十二条语汇</h2>
        <p>两片都是「静帧为主、动作为短爆发」：PV 有 44% 的时间画面是静的，靠硬切在异质静帧之间制造能量；UI 有 81% 是静的，整屏入场只靠一次 0.25–0.30s 的色带展开。本站照此定预算：<b>换页硬切，屏内只组装一次，之后不动</b>。</p>
        <table>
          <tr><th>#</th><th>语汇</th><th>时长</th><th>出处</th></tr>
          <tr><td>1</td><td>线生长（<code>scaleX</code> 0→1）</td><td>340ms 线性</td><td>UI 00:00:03</td></tr>
          <tr><td>2</td><td>字被「排」出来（<code>clip-path</code> 左→右）</td><td>440ms，组内 40–90ms</td><td>UI 00:00:04</td></tr>
          <tr><td>3</td><td>记号长出：2px 线 / 20px 红带 / 96px 红牌</td><td>220 / 240 / 160ms</td><td>PV 00:02:07、UI 红缎带</td></tr>
          <tr><td>4</td><td>骨架先行：线、牌、幽灵字先到，字晚 120ms</td><td>基延迟 120ms</td><td>PV 顿切簇</td></tr>
          <tr><td>5</td><td>图版扫描：黑板发丝线沿自身轴画出</td><td>700ms 线性</td><td>PV 每张图版</td></tr>
          <tr><td>6</td><td>读数跳格：<code>tabular-nums</code>，5 格递增</td><td>320ms</td><td>UI 00:00:22</td></tr>
          <tr><td>7</td><td>红牌落位（<code>clip</code> 揭开，不缩放）</td><td>160ms</td><td>PV 00:02:07</td></tr>
          <tr><td>8</td><td>页码跳号（状态，非动画）</td><td>0ms</td><td>手册 5.14</td></tr>
          <tr><td>9</td><td>刻度逐格点亮（12 格 × 20ms）</td><td>240ms</td><td>PV 刻度线</td></tr>
          <tr><td>10</td><td>引线生长，末端横杠 0ms 硬现</td><td>220ms</td><td>UI 00:02:38</td></tr>
          <tr><td>11</td><td>纵向卷帘：引文牌自上而下揭开</td><td>320ms</td><td>PV 奶油牌</td></tr>
          <tr><td>12</td><td>框线收束：四角 L 线由角点揭开</td><td>220ms</td><td>PV 角标</td></tr>
        </table>
        <div class="spec curtain">
          <div class="hd"><span>标本 S7　刻度 / 引线 / 框角</span><em>语汇 9–12</em></div>
          <div class="bd">
            <div class="ticks" aria-hidden="true">${Array.from({length:12},(_,i)=>`<i style="--d:${i*20}ms"></i>`).join('')}</div>
            <div class="leader" aria-hidden="true"><span class="dot"></span><span class="ln"></span><span class="end"></span><span class="chip">A-56</span></div>
            <div class="corns" style="height:56px;padding:8px 10px"><i></i><i></i><i></i><i></i><span class="tiny">框角：由角点揭开，不缩放</span></div>
          </div>
          <div class="note">刻度 12×20ms；引线 220ms；框角 220ms。三条都只用裁切与线长，不动位置。</div>
        </div>
        <p>不做的事写清楚：没有滚动揭示、没有位移与缩放、没有换页淡入、没有循环动效、不给插图配动效。内容元素的透明度恒为 1——所有「出现」都是裁切揭开，不是淡入；斜切色块、雷达环这类需要位移或大量 SVG 的做法，在参考片里很好看，但不进本站。</p>
        <p>并发上限 32，整页转场 ≤950ms；语汇 9–12 只在文章页与规范页触发，每页最多同时两条。系统里打开「减少动态效果」时，十二条全部瞬时到位，状态照常工作。</p>
        <p>音效全部由 Web Audio 现场合成，没有音频文件，默认关闭，按 S 或页脚按钮打开。</p>
      </article>
      <aside class="gutter"><div class="sticky">
        <div class="gblock"><b>本章</b>03　规范</div>
        <div class="gblock"><b>依据</b>NHB 1430.2（1976）<br>PV 5:19 · UI 1:31</div>
        <div class="gblock"><b>下一页</b><a href="#/">回到文章</a></div>
      </div></aside>
    </div>
  </div>
  <div style="height:48px"></div>`;
}

function viewMissing(){
  return `
  <div class="wrap" style="padding:80px 0 120px">
    <div class="grid">
      <p class="eyebrow" style="grid-column:1 / span 4;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B655E">404</p>
      <h1 style="grid-column:1 / span 8;font-size:clamp(28px,4.4vw,52px);font-weight:300;margin-top:14px">这里没有页面。</h1>
      <p style="grid-column:1 / span 6;margin-top:20px;font-size:16px">地址可能变了。<a href="#/">回到首页</a>看全部文章。</p>
    </div>
  </div>`;
}

/* ── 元信息 ── */
function setMeta(name, value, prop){
  const sel = prop ? `meta[property="${name}"]` : `meta[name="${name}"]`;
  let el = document.querySelector(sel);
  if (!el) { el = document.createElement('meta'); el.setAttribute(prop ? 'property' : 'name', name); document.head.appendChild(el); }
  el.setAttribute('content', value);
}
function writeHead(title, desc, rest){
  document.title = title;
  setMeta('description', desc);
  setMeta('og:title', title, true);
  setMeta('og:description', desc, true);
  setMeta('og:url', SITE.origin + '/' + rest, true);
  setMeta('og:type', 'website', true);
}

/* ── 页码：页脚与运行头随小节变化（5.14 + PV 的读数做法） ── */
let io = null, lastFolio = '';
function setFolio(v){
  if (v === lastFolio) return;
  lastFolio = v;
  const f = $('#folio'); if (f) f.textContent = v;
  const r = $('#runfolio'); if (r) r.textContent = v;
}
function observeSections(root){
  if (io) io.disconnect();
  const heads = [...root.querySelectorAll('.prose h2[id]')];
  if (!heads.length || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(list => {
    list.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll('.side a').forEach(a => {
        if (a.getAttribute('href').endsWith('/' + e.target.id)) a.setAttribute('aria-current','true');
        else a.removeAttribute('aria-current');
      });
    });
  }, { rootMargin:'0px 0px -70% 0px', threshold:0 });
  heads.forEach(h => io.observe(h));
}

/* ── 进度条 ── */
let scrollable = 0;
function measure(){ scrollable = document.documentElement.scrollHeight - innerHeight; }
function progress(){
  const h = location.hash || '';
  if (!h.startsWith('#/') || h === '#/' || h === '#') { fill.style.width = '0'; measure(); return; }
  if (scrollable <= 0) measure();
  fill.style.width = (scrollable > 0 ? Math.min(100, scrollY / scrollable * 100) : 0) + '%';
}
addEventListener('scroll', progress, { passive:true });
addEventListener('resize', () => { measure(); progress(); }, { passive:true });

/* ── 音效：Web Audio 现场合成，默认关闭 ── */
const Sound = (() => {
  const KEY = 'nova-sound';
  let ctx = null, master = null, noise = null, on = false;
  const ensure = () => {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
    const n = Math.floor(ctx.sampleRate * 0.5);
    noise = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    return ctx;
  };
  const wake = () => { if (ctx.state === 'suspended') ctx.resume(); };
  const tone = ({ f, to, type='sine', t=0.07, g=0.04, delay=0 }) => {
    if (!on || !ensure()) return; wake();
    const now = ctx.currentTime + delay;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    if (to) o.frequency.exponentialRampToValueAtTime(to, now + t);
    gn.gain.setValueAtTime(0.0001, now);
    gn.gain.exponentialRampToValueAtTime(g, now + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, now + t);
    o.connect(gn); gn.connect(master); o.start(now); o.stop(now + t + 0.03);
  };
  const hiss = ({ t=0.22, g=0.04, f0=500, f1=2400 }) => {
    if (!on || !ensure()) return; wake();
    const now = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(f0, now); bp.frequency.exponentialRampToValueAtTime(f1, now + t);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(g, now); gn.gain.exponentialRampToValueAtTime(0.0004, now + t);
    src.connect(bp); bp.connect(gn); gn.connect(master); src.start(now); src.stop(now + t + 0.02);
  };
  const CUES = {
    nav:  () => tone({ f:520, to:660, type:'triangle', t:0.06, g:0.028 }),
    open: () => { hiss({ t:0.16, g:0.026, f0:900, f1:2200 }); tone({ f:330, to:440, type:'triangle', t:0.09, g:0.026, delay:0.02 }); },
    grid: () => hiss({ t:0.24, g:0.04, f0:380, f1:2600 }),
    flat: () => hiss({ t:0.18, g:0.028, f0:2400, f1:300 }),
    logo: () => tone({ f:180, to:360, type:'triangle', t:0.4, g:0.022 })
  };
  return {
    get on(){ return on; },
    load(){ try { on = localStorage.getItem(KEY) === '1'; } catch(e) { on = false; } return on; },
    toggle(){
      on = !on;
      try { localStorage.setItem(KEY, on ? '1' : '0'); } catch(e) {}
      if (on) { ensure(); if (ctx && ctx.state === 'suspended') ctx.resume(); CUES.grid(); }
      return on;
    },
    play(n){ if (!on || !ctx) return; try { const c = CUES[n]; if (c) c(); } catch(e) {} },
    arm(){ if (!on) return; const c = ensure(); if (c && ctx.state === 'suspended') ctx.resume(); }
  };
})();

/* ── 路由：#/、#/archive、#/about、#/standards[/小节]、#/post/slug[/小节] ── */
let lastKey = '';
/* ── 换页：CUT（同帧交接）→ SKELETON（骨架）→ SET（文字） ── */
let navSeq = 0, rafA = 0, rafB = 0;
try { history.scrollRestoration = 'manual'; } catch(e) {}
function mountCut(textDelay){
  const seq = ++navSeq;
  cancelAnimationFrame(rafA); cancelAnimationFrame(rafB);
  app.style.setProperty('--base', textDelay + 'ms');
  if (rm.matches){ app.classList.add('mount'); countUp(app); return; }
  rafA = requestAnimationFrame(() => {
    rafB = requestAnimationFrame(() => {
      if (seq !== navSeq) return;
      app.classList.add('mount');
      countUp(app);
    });
  });
}
/* 语汇 6：读数跳格。只跳由内容决定的数，5 格递增 */
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el => {
    const target = parseInt(el.dataset.count, 10);
    if (!isFinite(target) || rm.matches){ el.textContent = target; return; }
    const t0 = performance.now(), dur = 320, steps = 5;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(target * (Math.floor(k * steps) / steps));
      if (k < 1) requestAnimationFrame(step); else el.textContent = target;
    };
    requestAnimationFrame(step);
  });
}

function route(){
  const hash = location.hash || '#/';
  if (!hash.startsWith('#/')) { if (hash === '#app') app.focus({ preventScroll:true }); return; }
  const parts = hash.split('/');
  const page = parts[1] || '';
  const seg2 = parts[2] || '';
  const seg3 = parts[3] || '';
  const isPost = page === 'post';
  const slug = isPost ? seg2 : '';
  const anchor = isPost ? seg3 : seg2;

  let html, title, desc, folio, rest = page, active = page || 'home';

  if (isPost) {
    const p = POSTS.find(x => x.slug === slug);
    html = p ? viewPost(slug) : viewMissing();
    title = p ? `${p.title} · ${SITE.name}` : `没有这个页面 · ${SITE.name}`;
    desc = p ? p.deck : '地址可能变了。';
    folio = p ? p.no : '—';
    rest = page + '/' + slug;
  } else if (page === 'archive') {
    html = viewArchive(); title = `归档 · ${SITE.name}`; desc = '按年份分组的全部文章。'; folio = '01';
  } else if (page === 'about') {
    html = viewAbout(); title = `关于 · ${SITE.name}`; desc = '关于这个博客，以及它为什么按 1976 年的手册排版。'; folio = '02';
  } else if (page === 'standards') {
    html = viewStandards(); title = `规范 · ${SITE.name}`; desc = '本站的图形标准：色彩、字体、网格、字标、图版、动效。'; folio = '03';
  } else if (!page) {
    html = viewHome(); title = `${SITE.name} · 设计、工程与太空`; desc = SITE.desc; folio = '1.0';
  } else {
    html = viewMissing(); title = `没有这个页面 · ${SITE.name}`; desc = '地址可能变了。'; folio = '—'; active = 'none';
  }

  const key = page + '|' + (isPost ? slug : '');   /* anchor 不参与：点目录不重渲染 */
  if (key !== lastKey) {
    const first = lastKey === '';
    app.classList.remove('mount');
    app.innerHTML = html;
    lastKey = key;
    hydrateMarks(app);
    if (!first) scrollTo(0, 0);
    app.setAttribute('aria-label', title);
    if (!first) app.focus({ preventScroll:true });
    observeSections(app);
    requestAnimationFrame(() => { measure(); progress(); });
    mountCut(first ? 0 : 120);
    Sound.play(first ? 'logo' : (isPost ? 'open' : 'nav'));
  }
  if (anchor) {
    const t = document.getElementById(anchor);
    if (t) t.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  writeHead(title, desc, rest);
  setFolio(folio);
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === (page === 'post' ? 'home' : active)) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  progress();
}
addEventListener('hashchange', route);
/* bfcache 恢复或 reduce 中途切换时，补一次挂载，避免停在裁切态 */
addEventListener('pageshow', e => { if (e.persisted) app.classList.add('mount'); });
rm.addEventListener('change', () => { if (rm.matches) app.classList.add('mount'); });

/* ── 网格叠加层（5.14）：带栏号 ── */
const ov = $('#overlay'), gbtn = $('#gbtn'), ovcols = $('#ovcols');
ovcols.innerHTML = Array.from({length:12},(_,i)=>`<i>${String(i+1).padStart(2,'0')}</i>`).join('');
function toggleGrid(){
  const on = ov.classList.toggle('on');
  gbtn.setAttribute('aria-pressed', String(on));
  gbtn.textContent = on ? '隐藏网格（G）' : '网格（G）';
  Sound.play(on ? 'grid' : 'flat');
}
gbtn.addEventListener('click', toggleGrid);

/* ── 音效开关（S） ── */
const sbtn = $('#sbtn');
Sound.load();
function paintSound(){
  sbtn.setAttribute('aria-pressed', String(Sound.on));
  sbtn.textContent = Sound.on ? '音效：开（S）' : '音效（S）';
}
paintSound();
/* 记住过「开」的读者，第一次点击或按键时解锁音频 */
['pointerdown','keydown'].forEach(t => addEventListener(t, () => Sound.arm(), { passive:true }));
sbtn.addEventListener('click', () => { Sound.toggle(); paintSound(); });

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'g') toggleGrid();
  if (k === 's') { Sound.toggle(); paintSound(); }
});

/* 点在当前页的链接上：回到顶部 */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a) return;
  const t = (a.getAttribute('href') || '').replace(/^#\//,'') || 'home';
  const c = (location.hash || '').replace(/^#\//,'') || 'home';
  if (t === c && a.getAttribute('href').split('/').length <= 2) window.scrollTo(0, 0);
});

route();
</script>
