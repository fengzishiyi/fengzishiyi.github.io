name: Deploy

# 纯静态站点：把仓库根目录原样上传到 GitHub Pages。
# 只有一个 index.html、一个 404.html 和一个 .nojekyll，没有构建步骤。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 站点设置若仍是「从分支发布」，这一步会在这里明确报错，
      # 而不是等 deploy 任务抛一个和原因无关的 API 错误。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
